name: Documentation

# Builds the Sphinx site in docs/site and publishes it to GitHub Pages
# (https://helenhuangmath.github.io/PeakAnnoAgent/). In the repository settings, set
# Pages -> Build and deployment -> Source to "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'pyproject.toml'
      - 'peakannoagent/tools.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/site/requirements.txt
      - name: Build the site
        run: sphinx-build -b html -W --keep-going docs/site docs/site/_build/html
      - run: touch docs/site/_build/html/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
